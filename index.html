// ============================================================
// GOOGLE AUTH — אמיתי עם Google Identity Services
// ============================================================
let _googleAccessToken = null;
const getAccessToken = () => _googleAccessToken;

const realGoogleLogin = () => {
  return new Promise((resolve, reject) => {
    if (!window.google) {
      alert("שגיאה: Google Identity Services לא נטען. ודא שהסקריפט נמצא ב-index.html");
      reject(new Error("GIS not loaded"));
      return;
    }
    const client = window.google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: [
        "openid",
        "email",
        "profile",
        "https://www.googleapis.com/auth/drive.file",
      ].join(" "),
      callback: async (tokenResponse) => {
        if (tokenResponse.error) { reject(tokenResponse); return; }
        _googleAccessToken = tokenResponse.access_token;
        try {
          const res = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", {
            headers: { Authorization: "Bearer " + _googleAccessToken },
          });
          const info = await res.json();
          resolve({
            id: info.sub,
            name: info.name,
            email: info.email,
            photo: info.picture,
            role: "pending",
            accessToken: _googleAccessToken,
          });
        } catch (e) { reject(e); }
      },
    });
    client.requestAccessToken({ prompt: "consent" });
  });
};

// ============================================================
// FILE UPLOAD TO GOOGLE DRIVE — אמיתי
// ============================================================
const uploadToDrive = async (file, folderKey, accessToken) => {
  const token = accessToken || getAccessToken();
  const folderId = DRIVE_FOLDERS[folderKey] || DRIVE_FOLDERS.main || null;

  // אם אין טוקן או folder ID — מחזיר מדומה עם אזהרה
  if (!token) {
    console.warn("אין access token — לא ניתן להעלות ל-Drive");
    return { id: "no_token", name: file.name, url: "#", webViewLink: "#", error: "לא מחובר ל-Google" };
  }

  try {
    const metadata = { name: file.name, ...(folderId ? { parents: [folderId] } : {}) };
    const form = new FormData();
    form.append("metadata", new Blob([JSON.stringify(metadata)], { type: "application/json" }));
    form.append("file", file);

    const res = await fetch(
      "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,webViewLink",
      { method: "POST", headers: { Authorization: "Bearer " + token }, body: form }
    );
    if (!res.ok) throw new Error(await res.text());
    const driveData = await res.json();
    return {
      id: driveData.id,
      name: driveData.name,
      url: "https://drive.google.com/file/d/" + driveData.id + "/view",
      webViewLink: driveData.webViewLink,
    };
  } catch (err) {
    console.error("שגיאה בהעלאה ל-Drive:", err);
    return { id: "local_" + Date.now(), name: file.name, url: "#", webViewLink: "#", saved: "locally" };
  }
};

const askClaude = async (prompt) => {
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: 1000,
      messages: [{ role: "user", content: prompt }],
    }),
  });
  const data = await response.json();
  return data.content?.[0]?.text || "שגיאה בקבלת תשובה";
};

// FILE UPLOAD COMPONENT
// ============================================================
const FileUploader = ({ onUpload, label = "העלה קובץ", folderKey = "main" }) => {
  const fileRef = React.useRef();
  const [uploading, setUploading] = React.useState(false);
  const [uploaded, setUploaded] = React.useState(null);
  const [preview, setPreview] = React.useState(null);
  const [previewType, setPreviewType] = React.useState(null);

  const handleFile = async (file) => {
    if (!file) return;
    setUploading(true);

    // Read as base64 for images — saved permanently
    let base64Preview = null;
    if (file.type.startsWith("image/")) {
      base64Preview = await new Promise(resolve => {
        const reader = new FileReader();
        reader.onload = e => resolve(e.target.result);
        reader.readAsDataURL(file);
      });
      setPreview(base64Preview);
      setPreviewType("image");
    } else {
      setPreview(file.name);
      setPreviewType(file.type === "application/pdf" ? "pdf" : "file");
    }

    try {
      const token = getAccessToken();
      const result = await uploadToDrive(file, folderKey, token);
      setUploaded(result);
      onUpload(result, base64Preview);
    } catch(err) {
      const fallback = { id: "local_" + Date.now(), name: file.name, url: "#", webViewLink: "#" };
      setUploaded(fallback);
      onUpload(fallback, base64Preview);
    } finally {
      setUploading(false);
    }
  };

  const handleCamera = () => {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = "image/*";
    input.capture = "environment";
    input.onchange = (e) => { if(e.target.files[0]) handleFile(e.target.files[0]); };
    document.body.appendChild(input);
    input.click();
    setTimeout(() => { try { document.body.removeChild(input); } catch(e){} }, 5000);
  };

  return (
    <div className="space-y-3">
      {preview && (
        <div className="relative rounded-xl overflow-hidden border border-gray-200">
          {previewType === "image" ? (
            <img src={preview} alt="תצוגה מקדימה" className="w-full max-h-48 object-cover rounded-xl" />
          ) : (
            <div className="flex items-center gap-3 p-3 bg-gray-50 rounded-xl">
              <span className="text-2xl">{previewType === "pdf" ? "📄" : "📎"}</span>
              <span className="text-sm text-gray-700 flex-1 truncate">{preview}</span>
            </div>
          )}
          {uploading && (
            <div className="absolute inset-0 bg-black/40 flex items-center justify-center rounded-xl">
              <div className="bg-white rounded-xl px-4 py-2 text-sm font-semibold">מעלה ל-Drive...</div>
            </div>
          )}
          {uploaded && !uploading && (
            <div className="absolute top-2 right-2 bg-emerald-500 text-white text-xs px-2 py-1 rounded-lg flex items-center gap-1">
              <Icon name="check" size={12} /> הועלה
            </div>
          )}
          <button onClick={(e) => { e.stopPropagation(); setPreview(null); setUploaded(null); setPreviewType(null); }}
            className="absolute top-2 left-2 w-6 h-6 bg-black/50 text-white rounded-full flex items-center justify-center z-10">
            <Icon name="x" size={12} />
          </button>
        </div>
      )}
      <div className="flex gap-2">
        <Button onClick={() => fileRef.current && fileRef.current.click()} variant="secondary" size="sm" disabled={uploading}>
          <Icon name="upload" size={16} />
          {uploading ? "מעלה..." : (preview ? "החלף קובץ" : label)}
        </Button>
        {!preview && (
          <Button onClick={handleCamera} variant="secondary" size="sm" disabled={uploading}>
            <Icon name="camera" size={16} />
            צלם
          </Button>
        )}
        {preview && !uploading && (
          <Button onClick={handleCamera} variant="secondary" size="sm">
            <Icon name="camera" size={16} />
            צלם שוב
          </Button>
        )}
      </div>
      {uploaded && uploaded.url && uploaded.url !== "#" && (
        <a href={uploaded.url} target="_blank" rel="noopener noreferrer" className="text-xs text-indigo-500 flex items-center gap-1">
          <Icon name="drive" size={12} /> צפה ב-Google Drive
        </a>
      )}
      <input ref={fileRef} type="file" accept="image/*,application/pdf,.doc,.docx"
        className="hidden" onChange={(e) => e.target.files[0] && handleFile(e.target.files[0])} />
    </div>
  );
};

// FINANCES
// ============================================================
const Finances = ({ data, setData, isCommittee }) => {
  const [finTab, setFinTab] = React.useState("income");
  const [showModal, setShowModal] = React.useState(false);
  const [showCsvModal, setShowCsvModal] = React.useState(false);
  const [type, setType] = React.useState("income");
  const [form, setForm] = React.useState({ description: "", amount: "", date: new Date().toISOString().split("T")[0], category: "", receipt: null });
  const [csvPreview, setCsvPreview] = React.useState(null);
  const [csvStatus, setCsvStatus] = React.useState(null);
  const [saveToDrive, setSaveToDrive] = React.useState(false);
  const [csvFile, setCsvFile] = React.useState(null);
  const csvFileRef = React.useRef();

  const totalIncome = data.finances.income.reduce((s, i) => s + Number(i.amount), 0);
  const totalExpenses = data.finances.expenses.reduce((s, i) => s + Number(i.amount), 0);

  const categories = {
    income: ["ועד בית", "שכירות שטחים", "קנסות", "אחר"],
    expenses: ["ניקיון", "גינון", "חשמל", "מים", "תחזוקה", "ביטוח", "ספק חיצוני", "אחר"],
  };

  const categorize = (desc) => {
    const d = (desc || '').toLowerCase();
    if (d.includes('מעלית') || d.includes('ברלינר')) return 'מעליות';
    if (d.includes('חשמל')) return 'חשמל';
    if (d.includes('ניקיון') || d.includes('פירון')) return 'ניקיון';
    if (d.includes('גינון') || d.includes('סמל')) return 'גינון';
    if (d.includes('ביטוח') || d.includes('מנורה')) return 'ביטוח';
    if (d.includes('מים') || d.includes('עיריית')) return 'מים';
    if (d.includes('פרטנר') || d.includes('תקשורת')) return 'תקשורת';
    if (d.includes('עמלת') || d.includes('בנק')) return 'עמלות בנק';
    if (d.includes('ועד') || d.includes('דמי')) return 'דמי ועד';
    if (d.includes('שיק')) return 'שיקים / ספקים';
    return 'אחר';
  };

  const parseCsv = (text, fileName) => {
    setCsvStatus({ type: 'loading', msg: 'מעבד קובץ...' });
    const lines = text.split(/\r?\n/).filter(l => l.trim());
    const sep = lines[0] && lines[0].includes('\t') ? '\t' : ',';
    const income = [];
    const expenses = [];

    lines.forEach((line, idx) => {
      if (idx === 0) return;
      const cols = line.split(sep).map(c => c.replace(/^"|"$/g, '').trim());
      if (cols.length < 3) return;
      let dateStr = '', desc = '', debit = 0, credit = 0;
      if (cols.length >= 6) {
        dateStr = cols[0]; desc = cols[2] || cols[1];
        debit = parseFloat((cols[4] || '0').replace(/,/g, '')) || 0;
        credit = parseFloat((cols[5] || '0').replace(/,/g, '')) || 0;
      } else {
        dateStr = cols[0]; desc = cols[1];
        const amt = parseFloat((cols[2] || '0').replace(/,/g, '')) || 0;
        if (amt > 0) credit = amt; else debit = Math.abs(amt);
      }
      if (!desc || (!debit && !credit)) return;
      let isoDate = new Date().toISOString().split('T')[0];
      const dp = dateStr.split(/[\/\-\.]/);
      if (dp.length === 3) {
        const d = dp[0].padStart(2,'0'), m = dp[1].padStart(2,'0');
        const y = dp[2].length === 2 ? '20'+dp[2] : dp[2];
        isoDate = y+'-'+m+'-'+d;
      }
      const entry = { id: Date.now() + Math.random(), description: desc, date: isoDate, category: categorize(desc), uploadedBy: 'ייבוא CSV' };
      if (credit > 0) income.push({ ...entry, amount: credit });
      if (debit > 0) expenses.push({ ...entry, amount: debit });
    });

    if (income.length === 0 && expenses.length === 0) {
      setCsvStatus({ type: 'error', msg: 'לא נמצאו נתונים. ודא שהקובץ בפורמט CSV תקין.' });
      return;
    }
    setCsvStatus(null);
    setCsvPreview({ income, expenses });
  };

  const handleCsvFile = (file) => {
    if (!file) return;
    setCsvFile(file);
    const reader = new FileReader();
    reader.onload = (e) => parseCsv(e.target.result, file.name);
    reader.readAsText(file, 'windows-1255');
  };

  const confirmCsvImport = async () => {
    if (!csvPreview) return;
    const merged = {
      ...data,
      finances: {
        income: [...(data.finances.income || []), ...csvPreview.income],
        expenses: [...(data.finances.expenses || []), ...csvPreview.expenses],
      }
    };
    setData(merged);
    fsSet(merged);

    if (saveToDrive && csvFile) {
      setCsvStatus({ type: 'loading', msg: '☁️ מעלה לGoogle Drive...' });
      const token = getAccessToken();
      if (!token) {
        setCsvStatus({ type: 'error', msg: '⚠️ לא מחובר לGoogle — הנתונים נשמרו אך הקובץ לא הועלה לDrive. יש להתנתק ולהתחבר מחדש.' });
        setCsvPreview(null);
        setTimeout(() => { setShowCsvModal(false); setCsvStatus(null); }, 3000);
        return;
      }
      const result = await uploadToDrive(csvFile, 'receipts', token);
      if (result.error) {
        setCsvStatus({ type: 'error', msg: `⚠️ הנתונים נשמרו, אך ההעלאה לDrive נכשלה: ${result.error}` });
      } else {
        setCsvStatus({ type: 'success', msg: `✅ יובאו ${csvPreview.income.length + csvPreview.expenses.length} תנועות ונשמרו ב-Drive` });
      }
    } else {
      setCsvStatus({ type: 'success', msg: `✅ יובאו ${csvPreview.income.length + csvPreview.expenses.length} תנועות` });
    }

    setCsvPreview(null);
    setTimeout(() => { setShowCsvModal(false); setCsvStatus(null); setCsvFile(null); setSaveToDrive(false); }, 2000);
  };

  const handleAdd = () => {
    const entry = { ...form, id: Date.now(), uploadedBy: "user" };
    const newData = { ...data, finances: { ...data.finances, [type]: [...data.finances[type], entry] } };
    setData(newData);
    setShowModal(false);
    setForm({ description: "", amount: "", date: new Date().toISOString().split("T")[0], category: "", receipt: null });
  };

  const deleteItem = (itemType, id) => {
    if (!confirm("למחוק שורה זו?")) return;
    const newData = { ...data, finances: { ...data.finances, [itemType]: data.finances[itemType].filter(i => i.id !== id) } };
    setData(newData);
  };

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between">
        <h2 className="font-black text-gray-900 text-xl">הכנסות והוצאות</h2>
        {isCommittee && (
          <div className="flex gap-2">
            <Button onClick={() => setShowCsvModal(true)} size="sm" variant="secondary">
              📂 CSV
            </Button>
            <Button onClick={() => setShowModal(true)} size="sm">
              <Icon name="plus" size={16} /> הוספה
            </Button>
          </div>
        )}
      </div>
      {!isCommittee && (
        <div className="p-3 bg-blue-50 rounded-xl text-xs text-blue-600 flex items-center gap-2">
          <span>👁️</span> צפייה בלבד — עריכה זמינה לנציג ועד
        </div>
      )}

      {/* Balance Cards */}
      <div className="grid grid-cols-3 gap-3">
        <Card className="!p-3 text-center">
          <div className="text-lg font-black text-emerald-600">₪{totalIncome.toLocaleString()}</div>
          <div className="text-xs text-gray-500">הכנסות</div>
        </Card>
        <Card className="!p-3 text-center">
          <div className="text-lg font-black text-red-500">₪{totalExpenses.toLocaleString()}</div>
          <div className="text-xs text-gray-500">הוצאות</div>
        </Card>
        <Card className={`!p-3 text-center ${totalIncome - totalExpenses >= 0 ? "bg-emerald-50" : "bg-red-50"}`}>
          <div className={`text-lg font-black ${totalIncome - totalExpenses >= 0 ? "text-emerald-700" : "text-red-600"}`}>
            ₪{Math.abs(totalIncome - totalExpenses).toLocaleString()}
          </div>
          <div className="text-xs text-gray-500">יתרה</div>
        </Card>
      </div>

      {/* Tabs */}
      <div className="flex gap-2 bg-gray-100 p-1 rounded-xl">
        {["income", "expenses"].map((t) => (
          <button key={t} onClick={() => setFinTab(t)}
            className={`flex-1 py-2 text-sm font-semibold rounded-lg transition-all ${finTab === t ? "bg-white shadow text-gray-900" : "text-gray-500"}`}>
            {t === "income" ? `💰 הכנסות (${data.finances.income.length})` : `📤 הוצאות (${data.finances.expenses.length})`}
          </button>
        ))}
      </div>

      {/* List */}
      <div className="space-y-2">
        {data.finances[finTab].length === 0 ? (
          <div className="text-center py-10">
            <p className="text-gray-400 text-sm mb-2">אין רשומות עדיין</p>
            {isCommittee && <p className="text-xs text-indigo-400">לחץ על "📂 CSV" לייבוא מהבנק</p>}
          </div>
        ) : (
          [...data.finances[finTab]].sort((a,b) => b.date.localeCompare(a.date)).map((item) => (
            <Card key={item.id} className="!p-4">
              <div className="flex items-start justify-between gap-2">
                <div className="flex-1 min-w-0">
                  <p className="font-semibold text-gray-900 text-sm truncate">{item.description}</p>
                  <p className="text-xs text-gray-400 mt-0.5">{item.date} · <span className="bg-gray-100 px-1.5 py-0.5 rounded-full">{item.category || 'אחר'}</span></p>
                  {item.receipt && (
                    <a href={item.receipt.url} target="_blank" rel="noopener noreferrer" className="text-xs text-indigo-500 flex items-center gap-1 mt-1">
                      <Icon name="file" size={12} /> קבלה
                    </a>
                  )}
                </div>
                <div className="flex items-center gap-2 flex-shrink-0">
                  <span className={`font-bold text-base ${finTab === "income" ? "text-emerald-600" : "text-red-500"}`}>
                    {finTab === "income" ? "+" : "-"}₪{Number(item.amount).toLocaleString()}
                  </span>
                  {isCommittee && (
                    <button onClick={() => deleteItem(finTab, item.id)} className="text-gray-300 hover:text-red-500 transition-colors">
                      <Icon name="trash" size={14} />
                    </button>
                  )}
                </div>
              </div>
            </Card>
          ))
        )}
      </div>

      {/* CSV Import Modal */}
      <Modal open={showCsvModal} onClose={() => { setShowCsvModal(false); setCsvPreview(null); setCsvStatus(null); }} title="ייבוא קובץ CSV מהבנק">
        <div className="space-y-4">
          <div className="p-3 bg-indigo-50 rounded-xl text-xs text-indigo-700 space-y-1">
            <p>📋 <b>פורמט נתמך:</b> CSV של בנק דיסקונט, הפועלים, לאומי</p>
            <p>📥 <b>איך להוריד:</b> כנס לבנק → דפי חשבון → ייצוא → CSV</p>
          </div>

          <input ref={csvFileRef} type="file" accept=".csv,.txt" className="hidden"
            onChange={e => e.target.files[0] && handleCsvFile(e.target.files[0])} />

          {!csvPreview && (
            <button onClick={() => csvFileRef.current && csvFileRef.current.click()}
              className="w-full flex flex-col items-center justify-center gap-2 py-8 bg-gray-50 border-2 border-dashed border-gray-300 rounded-2xl text-gray-500 hover:border-indigo-400 hover:bg-indigo-50 hover:text-indigo-600 transition-all">
              <span className="text-3xl">📂</span>
              <span className="text-sm font-semibold">לחץ לבחירת קובץ CSV</span>
              <span className="text-xs text-gray-400">מהמחשב או מהטלפון</span>
            </button>
          )}

          {csvStatus && (
            <div className={`p-3 rounded-xl text-sm font-medium ${csvStatus.type === 'success' ? 'bg-emerald-50 text-emerald-700' : csvStatus.type === 'error' ? 'bg-red-50 text-red-600' : 'bg-blue-50 text-blue-600'}`}>
              {csvStatus.msg}
            </div>
          )}

          {csvPreview && (
            <div className="space-y-3">
              {/* Summary */}
              <div className="grid grid-cols-2 gap-2">
                <div className="bg-emerald-50 rounded-xl p-3 text-center">
                  <div className="font-black text-emerald-700 text-lg">{csvPreview.income.length}</div>
                  <div className="text-xs text-emerald-600">הכנסות</div>
                  <div className="text-xs font-semibold text-emerald-700">₪{csvPreview.income.reduce((s,i)=>s+i.amount,0).toLocaleString()}</div>
                </div>
                <div className="bg-red-50 rounded-xl p-3 text-center">
                  <div className="font-black text-red-600 text-lg">{csvPreview.expenses.length}</div>
                  <div className="text-xs text-red-500">הוצאות</div>
                  <div className="text-xs font-semibold text-red-600">₪{csvPreview.expenses.reduce((s,i)=>s+i.amount,0).toLocaleString()}</div>
                </div>
              </div>

              {/* Preview table */}
              <div className="bg-gray-50 rounded-xl overflow-hidden">
                <div className="px-3 py-2 bg-gray-100 flex justify-between items-center">
                  <span className="text-xs font-bold text-gray-600">תצוגה מקדימה (10 ראשונות)</span>
                  <button onClick={() => csvFileRef.current && csvFileRef.current.click()} className="text-xs text-indigo-500">החלף קובץ</button>
                </div>
                <div className="divide-y divide-gray-100 max-h-52 overflow-y-auto">
                  {[...csvPreview.income.map(i=>({...i,_t:'income'})), ...csvPreview.expenses.map(i=>({...i,_t:'expenses'}))]
                    .sort((a,b) => b.date.localeCompare(a.date))
                    .slice(0,10)
                    .map((item, idx) => (
                      <div key={idx} className="flex items-center justify-between px-3 py-2 text-xs">
                        <div className="flex-1 min-w-0">
                          <p className="font-medium text-gray-800 truncate">{item.description}</p>
                          <p className="text-gray-400">{item.date} · {item.category}</p>
                        </div>
                        <span className={`font-bold ml-2 flex-shrink-0 ${item._t === 'income' ? 'text-emerald-600' : 'text-red-500'}`}>
                          {item._t === 'income' ? '+' : '-'}₪{Number(item.amount).toLocaleString()}
                        </span>
                      </div>
                    ))}
                </div>
              </div>

              <label className="flex items-center gap-3 p-3 bg-gray-50 rounded-xl cursor-pointer hover:bg-indigo-50 transition-all border border-gray-200">
                <input type="checkbox" checked={saveToDrive} onChange={e => setSaveToDrive(e.target.checked)}
                  className="w-4 h-4 accent-indigo-600 cursor-pointer" />
                <div className="flex-1">
                  <p className="text-sm font-semibold text-gray-800">שמור קובץ ב-Google Drive</p>
                  <p className="text-xs text-gray-400">העלה את ה-CSV לתיקיית הקבלות לארכיון</p>
                </div>
                <span className="text-lg">☁️</span>
              </label>

              <div className="flex gap-2">
                <Button onClick={confirmCsvImport} className="flex-1 justify-center">
                  ✅ אישור ייבוא
                </Button>
                <Button onClick={() => { setCsvPreview(null); setCsvStatus(null); }} variant="secondary" className="flex-1 justify-center">
                  ביטול
                </Button>
              </div>
            </div>
          )}
        </div>
      </Modal>

      {/* Manual Add Modal */}
      <Modal open={showModal} onClose={() => setShowModal(false)} title="הוספת רשומה">
        <div className="space-y-4">
          <div className="flex gap-2 bg-gray-100 p-1 rounded-xl">
            {["income", "expenses"].map((t) => (
              <button key={t} onClick={() => setType(t)} className={`flex-1 py-2 text-sm font-semibold rounded-lg transition-all ${type === t ? "bg-white shadow" : "text-gray-500"}`}>
                {t === "income" ? "הכנסה" : "הוצאה"}
              </button>
            ))}
          </div>
          <input className="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm" placeholder="תיאור" value={form.description} onChange={(e) => setForm({ ...form, description: e.target.value })} />
          <input type="number" className="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm" placeholder="סכום ₪" value={form.amount} onChange={(e) => setForm({ ...form, amount: e.target.value })} />
          <input type="date" className="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} />
          <select className="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm" value={form.category} onChange={(e) => setForm({ ...form, category: e.target.value })}>
            <option value="">בחר קטגוריה</option>
            {categories[type].map((c) => <option key={c}>{c}</option>)}
          </select>
          <div>
            <p className="text-sm font-semibold text-gray-700 mb-2">העלאת קבלה לGoogle Drive</p>
            <FileUploader onUpload={(file) => setForm({ ...form, receipt: file })} label="העלה קבלה" folderKey="receipts" />
          </div>
          <Button onClick={handleAdd} className="w-full justify-center" disabled={!form.description || !form.amount}>
            שמירה
          </Button>
        </div>
      </Modal>
    </div>
  );
};

// ============================================================
// FAULTS
// ============================================================
const Faults = ({ data, setData, user, isCommittee }) => {
  const [showModal, setShowModal] = React.useState(false);
  const [form, setForm] = React.useState({ description: "", location: "", priority: "medium", files: [] });
  const [filter, setFilter] = React.useState("all");
  const [expandedFault, setExpandedFault] = React.useState(null);
  const [waDraft, setWaDraft] = React.useState("");
  const [showWaModal, setShowWaModal] = React.useState(false);

  const priorities = { low: { label: "נמוכה", color: "gray" }, medium: { label: "בינונית", color: "yellow" }, high: { label: "גבוהה", color: "red" } };
  const statuses = { open: { label: "פתוחה", color: "red" }, in_progress: { label: "בטיפול", color: "yellow" }, resolved: { label: "נסגרה", color: "green" } };

  const handleAdd = () => {
    const fault = {
      ...form,
      id: Date.now(),
      status: "open",
      date: new Date().toISOString().split("T")[0],
      reportedBy: user.name,
      comments: [],
    };
    const newData = { ...data, faults: [...data.faults, fault] };
    setData(newData);
    setShowModal(false);
    setForm({ description: "", location: "", priority: "medium", files: [] });

    // Save WhatsApp draft for later sending
    const priorityLabel = { low: "נמוכה", medium: "בינונית", high: "גבוהה" }[form.priority];
    setWaDraft(
      "🔧 תקלה חדשה דווחה בבניין\n" +
      "תיאור: " + fault.description + "\n" +
      "מיקום: " + (fault.location || "לא צוין") + "\n" +
      "עדיפות: " + priorityLabel + "\n" +
      "דווח על ידי: " + fault.reportedBy
    );
    setShowWaModal(true);
  };

  const updateStatus = (id, status) => {
    setData({ ...data, faults: data.faults.map((f) => (f.id === id ? { ...f, status } : f)) });
  };

  const filtered = filter === "all" ? data.faults : data.faults.filter((f) => f.status === filter); // faults filter

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between">
        <h2 className="font-black text-gray-900 text-xl">ניהול תקלות</h2>
        <Button onClick={() => setShowModal(true)} size="sm">
          <Icon name="plus" size={16} /> דיווח
        </Button>
      </div>

      {/* Filter */}
      <div className="flex gap-2 overflow-x-auto pb-1">
        {[["all", "הכל"], ["open", "פתוחות"], ["in_progress", "בטיפול"], ["resolved", "נסגרו"]].map(([val, label]) => (
          <button key={val} onClick={() => setFilter(val)} className={`flex-shrink-0 px-3 py-1.5 rounded-xl text-xs font-semibold transition-all ${filter === val ? "bg-indigo-600 text-white" : "bg-gray-100 text-gray-600"}`}>
            {label}
          </button>
        ))}
      </div>

      <div className="space-y-3">
        {filtered.length === 0 ? (
          <p className="text-center text-gray-400 py-8 text-sm">אין תקלות {filter !== "all" ? statuses[filter]?.label : ""}</p>
        ) : (
          filtered.map((fault) => (
            <Card key={fault.id} className="cursor-pointer" onClick={(e) => {
              if (e.target.closest('button') || e.target.closest('a')) return;
              setExpandedFault(expandedFault === fault.id ? null : fault.id);
            }}>
              <div className="flex items-start justify-between mb-2">
                <div className="flex-1 ml-2">
                  <p className="font-semibold text-gray-900 text-sm">{fault.description}</p>
                  <p className="text-xs text-gray-400 mt-0.5">📍 {fault.location} · {fault.date} · {fault.reportedBy}</p>
                </div>
                <div className="flex flex-col gap-1 items-end">
                  <Badge text={statuses[fault.status]?.label} color={statuses[fault.status]?.color} />
                  <Badge text={priorities[fault.priority]?.label} color={priorities[fault.priority]?.color} />
                </div>
              </div>
              {expandedFault === fault.id && (
                <div className="mt-3 pt-3 border-t border-gray-100 space-y-2">
                  {fault.location && <p className="text-sm text-gray-600">📍 מיקום: {fault.location}</p>}
                  <p className="text-sm text-gray-600">👤 דווח על ידי: {fault.reportedBy}</p>
                  <p className="text-sm text-gray-600">📅 תאריך: {fault.date}</p>
                  <div className="flex items-center gap-2">
                    <button
                      onClick={e => {
                        e.stopPropagation();
                        setWaDraft(
                          "🔧 תקלה בבניין\n" +
                          "תיאור: " + fault.description + "\n" +
                          "מיקום: " + (fault.location || "לא צוין") + "\n" +
                          "סטטוס: " + statuses[fault.status]?.label + "\n" +
                          "עדיפות: " + priorities[fault.priority]?.label + "\n" +
                          "תאריך: " + fault.date

                        setShowWaModal(true);

                      className="flex items-center gap-2 text-sm text-green-600 bg-green-50 px-3 py-2 rounded-xl hover:bg-green-100 transition-all"

                      <svg width="16" height="16" viewBox="0 0 24 24" fill="#25D366"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.124.558 4.118 1.529 5.845L.057 23.882l6.174-1.438A11.945 11.945 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.818a9.818 9.818 0 01-5.017-1.382l-.36-.214-3.664.853.882-3.56-.234-.373A9.818 9.818 0 0112 2.182c5.42 0 9.818 4.398 9.818 9.818s-4.398 9.818-9.818 9.818z"/></svg>
                      שלח עדכון
                    </button>
                  </div>
                </div>
              )}
              {fault.files?.length > 0 && (
                <div className="space-y-2 mb-3">
                  <div className="flex flex-wrap gap-2">
                    {fault.files.map((f, i) => {
                      const isImage = f.name && /\.(jpg|jpeg|png|gif|webp|heic)$/i.test(f.name);
                      const isLocal = f.id && f.id.startsWith("local_");
                      return (
                        <div key={i}>
                          {isImage && (f.localPreview || (f.url && f.url !== "#")) ? (
                            <div className="relative">
                              <img
                                src={f.localPreview || ("https://drive.google.com/thumbnail?id=" + f.id + "&sz=w200")}
                                alt={f.name}
                                className="w-20 h-20 object-cover rounded-xl border border-gray-200 cursor-pointer"
                                onClick={e => { e.stopPropagation(); window.open(f.url && f.url !== "#" ? f.url : f.localPreview, "_blank"); }}
                                onError={e => { e.target.style.display="none"; e.target.nextSibling && (e.target.nextSibling.style.display="flex"); }}
                              />
                              {f.url && f.url !== "#" && (
                                <a href={f.url} target="_blank" rel="noopener noreferrer"
                                  onClick={e => e.stopPropagation()}
                                  className="absolute bottom-1 right-1 bg-black/50 text-white text-xs px-1 rounded">
                                  Drive
                                </a>
                              )}
                            </div>
                          ) : (
                            <a href={f.url && f.url !== "#" ? f.url : "#"} target="_blank" rel="noopener noreferrer"
                              onClick={e => { e.stopPropagation(); e.preventDefault(); if (f.url && f.url !== "#") window.open(f.url, "_blank"); }}
                              className="text-xs text-indigo-500 bg-indigo-50 px-2 py-1 rounded-lg flex items-center gap-1">
                              <Icon name="file" size={12} /> {f.name}
                            </a>
                          )}

                      );
                    })}
                  </div>
                </div>
              )}
              <div className="flex gap-2 flex-wrap mt-2">
                {/* WA button — visible to all */}
                <button
                  onClick={e => {
                    e.stopPropagation();
                    setWaDraft(
                      "🔧 תקלה בבניין\n" +
                      "תיאור: " + fault.description + "\n" +
                      "מיקום: " + (fault.location || "לא צוין") + "\n" +
                      "סטטוס: " + (statuses[fault.status]?.label || "") + "\n" +
                      "תאריך: " + fault.date
                    );
                    setShowWaModal(true);
                  }}
                  className="flex items-center gap-1.5 text-xs text-green-600 bg-green-50 px-3 py-1.5 rounded-xl hover:bg-green-100 transition-all"
                >
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="#25D366"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.124.558 4.118 1.529 5.845L.057 23.882l6.174-1.438A11.945 11.945 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.818a9.818 9.818 0 01-5.017-1.382l-.36-.214-3.664.853.882-3.56-.234-.373A9.818 9.818 0 0112 2.182c5.42 0 9.818 4.398 9.818 9.818s-4.398 9.818-9.818 9.818z"/></svg>
                  עדכן ב-WA
                </button>
                {isCommittee && (
                  <>
                    {fault.status !== "resolved" && fault.status === "open" && (
                      <Button onClick={e => { e.stopPropagation(); updateStatus(fault.id, "in_progress"); }} variant="secondary" size="sm">
                        קבל לטיפול
                      </Button>
                    )}
                    {fault.status !== "resolved" && (
                      <Button onClick={e => { e.stopPropagation(); updateStatus(fault.id, "resolved"); }} variant="success" size="sm">
                        <Icon name="check" size={14} /> סגור
                      </Button>
                    )}
                    <Button onClick={e => {
                      e.stopPropagation();
                      if (confirm("למחוק תקלה זו?")) {
                        setData({...data, faults: data.faults.filter(f => f.id !== fault.id)});
                      }
                    }} variant="danger" size="sm">
                      <Icon name="trash" size={14} /> מחק
                    </Button>
                  </>
                )}
              </div>
            </Card>
          ))
        )}
      </div>

      {/* WhatsApp Draft Modal */}
      <Modal open={showWaModal} onClose={() => setShowWaModal(false)} title="📲 שלח הודעה ב-WhatsApp">
        <div className="space-y-4">
          <p className="text-sm text-gray-500">ערוך את ההודעה לפני השליחה:</p>
          <textarea
            className="w-full border border-gray-200 rounded-xl px-3 py-3 text-sm resize-none"
            rows={7}
            value={waDraft}
            onChange={e => setWaDraft(e.target.value)}
          />
          <div className="flex gap-2">
            <Button
              onClick={() => {
                window.open("https://wa.me/?text=" + encodeURIComponent(waDraft), "_blank");
                setShowWaModal(false);
              }}
              className="flex-1 justify-center bg-green-600 text-white hover:bg-green-700"
            >
              💬 שלח ב-WhatsApp
            </Button>
            <Button onClick={() => setShowWaModal(false)} variant="secondary">
              שמור לאחר כך
            </Button>
          </div>
          <p className="text-xs text-gray-400 text-center">ניתן גם לשלוח מאוחר יותר מתוך פרטי התקלה</p>
        </div>
      </Modal>

      <Modal open={showModal} onClose={() => setShowModal(false)} title="דיווח תקלה חדשה">
        <div className="space-y-4">
          <textarea className="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm resize-none" rows={3} placeholder="תיאור התקלה" value={form.description} onChange={(e) => setForm({ ...form, description: e.target.value })} />
          <input className="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm" placeholder="מיקום (קומה, אזור...)" value={form.location} onChange={(e) => setForm({ ...form, location: e.target.value })} />
          <div>
            <label className="text-sm font-semibold text-gray-700 mb-2 block">עדיפות</label>
            <div className="flex gap-2">
              {Object.entries(priorities).map(([val, { label, color }]) => (
                <button key={val} onClick={() => setForm({ ...form, priority: val })} className={`flex-1 py-2 text-sm rounded-xl font-semibold border-2 transition-all ${form.priority === val ? "border-indigo-500 bg-indigo-50 text-indigo-700" : "border-gray-200 text-gray-500"}`}>
                  {label}
                </button>
              ))}
            </div>
          </div>
          <div>
            <p className="text-sm font-semibold text-gray-700 mb-2">תמונות / מסמכים (יועלו ל-Drive)</p>
            <FileUploader
                  onUpload={(file, localPreview) => {
                    const fileWithPreview = {...file, localPreview: localPreview || null};
                    setForm(prev => ({ ...prev, files: [...prev.files, fileWithPreview] }));
                  }}
                  label="הוסף קובץ" folderKey="faults" />
            {form.files.length > 0 && <p className="text-xs text-emerald-600 mt-1">{form.files.length} קבצים מצורפים</p>}
          </div>
          <Button onClick={handleAdd} className="w-full justify-center" disabled={!form.description}>
            שלח דיווח
          </Button>
        </div>
      </Modal>
    </div>
  );
};

// ============================================================
// INSPECTIONS
// ============================================================
const Inspections = ({ data, setData, isCommittee }) => {
  const [showModal, setShowModal] = React.useState(false);
  const [form, setForm] = React.useState({ name: "", type: "", date: "", nextDate: "", notes: "", files: [] });

  const types = ["מעלית", "גז", "חשמל", "אש ופינוי", "מיקלט", "גג", "צנרת", "מערכת כיבוי אש", "אחר"];

  const getStatus = (nextDate) => {
    if (!nextDate) return { label: "לא נקבע", color: "gray" };
    const days = Math.floor((new Date(nextDate) - new Date()) / (1000 * 60 * 60 * 24));
    if (days < 0) return { label: "פג תוקף!", color: "red" };
    if (days <= 30) return { label: `${days} ימים`, color: "yellow" };
    return { label: `${days} ימים`, color: "green" };
  };

  const handleAdd = () => {
    const inspection = { ...form, id: Date.now() };
    setData({ ...data, inspections: [...data.inspections, inspection] });
    setShowModal(false);
    setForm({ name: "", type: "", date: "", nextDate: "", notes: "", files: [] });
  };

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between">
        <h2 className="font-black text-gray-900 text-xl">בדיקות חובה</h2>
        {isCommittee && (
          <Button onClick={() => setShowModal(true)} size="sm">
            <Icon name="plus" size={16} /> הוספה
          </Button>
        )}
      </div>

      <div className="p-3 bg-amber-50 rounded-xl text-xs text-amber-700 flex items-start gap-2">
        <Icon name="info" size={14} />
        <span>בדיקות חובה נדרשות על פי תקנות התכנון והבנייה ותקנות המעליות</span>
      </div>

      <div className="space-y-3">
        {data.inspections.length === 0 ? (
          <p className="text-center text-gray-400 py-8 text-sm">לא נרשמו בדיקות עדיין</p>
        ) : (
          data.inspections.map((insp) => {
            const status = getStatus(insp.nextDate);
            return (
              <Card key={insp.id}>
                <div className="flex items-start justify-between">
                  <div>
                    <div className="flex items-center gap-2 mb-1">
                      <span className="font-semibold text-gray-900 text-sm">{insp.name}</span>
                      <Badge text={insp.type} color="purple" />
                    </div>
                    <p className="text-xs text-gray-400">בדיקה אחרונה: {insp.date || "לא ידוע"}</p>
                    <p className="text-xs text-gray-400">בדיקה הבאה: {insp.nextDate || "לא נקבע"}</p>
                    {insp.notes && <p className="text-xs text-gray-500 mt-1">{insp.notes}</p>}
                  </div>
                  <Badge text={status.label} color={status.color} />
                </div>
                {insp.files?.length > 0 && (
                  <div className="mt-2 flex gap-2">
                    {insp.files.map((f, i) => (
                      <a key={i} href={f.url} target="_blank" rel="noopener noreferrer" className="text-xs text-indigo-500 bg-indigo-50 px-2 py-1 rounded-lg">
                        📄 {f.name}
                      </a>
                    ))}
                  </div>
                )}
              </Card>
            );
          })
        )}
      </div>

      <Modal open={showModal} onClose={() => setShowModal(false)} title="הוספת בדיקת חובה">
        <div className="space-y-4">
          <input className="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm" placeholder="שם הבדיקה" value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} />
          <select className="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm" value={form.type} onChange={(e) => setForm({ ...form, type: e.target.value })}>
            <option value="">סוג בדיקה</option>
            {types.map((t) => <option key={t}>{t}</option>)}
          </select>
          <div>
            <label className="text-xs font-semibold text-gray-500 mb-1 block">תאריך בדיקה אחרונה</label>
            <input type="date" className="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} />
          </div>
          <div>
            <label className="text-xs font-semibold text-gray-500 mb-1 block">תאריך בדיקה הבאה</label>
            <input type="date" className="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm" value={form.nextDate} onChange={(e) => setForm({ ...form, nextDate: e.target.value })} />
          </div>
          <textarea className="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm resize-none" rows={2} placeholder="הערות" value={form.notes} onChange={(e) => setForm({ ...form, notes: e.target.value })} />
          <div>
            <p className="text-sm font-semibold text-gray-700 mb-2">אישורים ומסמכים (יועלו ל-Drive)</p>
            <FileUploader onUpload={(file) => setForm({ ...form, files: [...form.files, file] })} folderKey="protocols" />
          </div>
          <Button onClick={handleAdd} className="w-full justify-center" disabled={!form.name || !form.type}>
            שמירה
          </Button>
        </div>
      </Modal>
    </div>
  );
};

const Protocols = ({ data, setData, isCommittee }) => {
  const [showModal, setShowModal] = React.useState(false);
  const [aiLoading, setAiLoading] = React.useState(false);
  const [form, setForm] = React.useState({ title: "", date: new Date().toISOString().split("T")[0], attendees: "", content: "", files: [] });

  const generateProtocol = async () => {
    setAiLoading(true);
    const text = await askClaude(`כתוב פרוטוקול ועד בית מקצועי בעברית על סמך הנושאים הבאים: "${form.content}". כלול: תאריך, נוכחים, סדר יום, דיון, החלטות, חתימות.`);
    setForm({ ...form, content: text });
    setAiLoading(false);
  };

  const handleAdd = () => {
    const protocol = { ...form, id: Date.now() };
    setData({ ...data, protocols: [...data.protocols, protocol] });
    setShowModal(false);
    setForm({ title: "", date: new Date().toISOString().split("T")[0], attendees: "", content: "", files: [] });
  };

  return (
    <div className="space-y-4">
      <div className="flex items-center justify-between">
        <h2 className="font-black text-gray-900 text-xl">פרוטוקולים</h2>
        {isCommittee && (
          <Button onClick={() => setShowModal(true)} size="sm">
            <Icon name="plus" size={16} /> חדש
          </Button>
        )}
      </div>
      {!isCommittee && (
        <div className="p-3 bg-blue-50 rounded-xl text-xs text-blue-600 flex items-center gap-2">
          <span>👁️</span> צפייה בלבד
        </div>
      )}

      <div className="space-y-3">
        {data.protocols.length === 0 ? (
          <p className="text-center text-gray-400 py-8 text-sm">אין פרוטוקולים עדיין</p>
        ) : (
          data.protocols.map((p) => (
            <Card key={p.id}>
              <div className="flex items-start justify-between mb-2">
                <div>
                  <p className="font-semibold text-gray-900 text-sm">{p.title}</p>
                  <p className="text-xs text-gray-400">{p.date}</p>
                  {p.attendees && <p className="text-xs text-gray-400">נוכחים: {p.attendees}</p>}
                </div>
                <Icon name="file" size={16} />
              </div>
              <p className="text-xs text-gray-600 line-clamp-2">{p.content}</p>
              {p.files?.length > 0 && (
                <div className="mt-2 flex gap-2 flex-wrap">
                  {p.files.map((f, i) => (
                    <a key={i} href={f.url} target="_blank" rel="noopener noreferrer" className="text-xs text-indigo-500 bg-indigo-50 px-2 py-1 rounded-lg">
                      📄 {f.name}
                    </a>
                  ))}
                </div>
              )}
            </Card>
          ))
        )}
      </div>

      <Modal open={showModal} onClose={() => setShowModal(false)} title="פרוטוקול חדש">
        <div className="space-y-4">
          <input className="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm" placeholder="כותרת הישיבה" value={form.title} onChange={(e) => setForm({ ...form, title: e.target.value })} />
          <input type="date" className="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} />
          <input className="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm" placeholder="נוכחים (שמות)" value={form.attendees} onChange={(e) => setForm({ ...form, attendees: e.target.value })} />
          <div>
            <div className="flex items-center justify-between mb-2">
              <label className="text-sm font-semibold text-gray-700">תוכן הפרוטוקול</label>
              <Button onClick={generateProtocol} variant="secondary" size="sm" disabled={aiLoading || !form.content}>
                {aiLoading ? "מייצר..." : "✨ Claude יכתוב"}
              </Button>
            </div>
            <textarea className="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm resize-none" rows={6} placeholder="הזן נושאי דיון או תוכן הפרוטוקול..." value={form.content} onChange={(e) => setForm({ ...form, content: e.target.value })} />
          </div>
          <div>
            <p className="text-sm font-semibold text-gray-700 mb-2">קבצים מצורפים (יועלו ל-Drive)</p>
            <FileUploader onUpload={(file) => setForm({ ...form, files: [...form.files, file] })} folderKey="protocols" />
          </div>
          <Button onClick={handleAdd} className="w-full justify-center" disabled={!form.title}>
            שמירה
          </Button>
        </div>
      </Modal>
    </div>
  );
};

const Residents = ({ data, setData, user, isCommittee }) => {
  const [showModal, setShowModal] = React.useState(false);
  const [showPending, setShowPending] = React.useState(false);
  const [selectedResident, setSelectedResident] = React.useState(null);
  const [editResident, setEditResident] = React.useState(null);
  const [form, setForm] = React.useState({ name: "", email: "", apartment: "", phone: "", role: "resident" });

  const pending = data.residents.filter((r) => r.status === "pending");

  const handleAdd = () => {
    const resident = { ...form, id: Date.now(), status: "active", joinDate: new Date().toISOString().split("T")[0] };
    setData({ ...data, residents: [...data.residents, resident] });
    setShowModal(false);
    setForm({ name: "", email: "", apartment: "", phone: "", role: "resident" });

  const approve = (id) => {
    setData({ ...data, residents: data.residents.map((r) => r.id === id ? { ...r, status: "active" } : r) });

    if (confirm("האם להסיר דייר זה?")) {
      setData({ ...data, residents: data.residents.filter((r) => r.id !== id) });

                      <svg width="12" height="12" viewBox="0 0 24 24" fill="#25D366"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.124.558 4.118 1.529 5.845L.057 23.882l6.174-1.438A11.945 11.945 0 0012 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 21.818a9.818 9.818 0 01-5.017-1.382l-.36-.214-3.664.853.882-3.56-.234-.373A9.818 9.818 0 0112 2.182c5.42 0 9.818 4.398 9.818 9.818s-4.398 9.818-9.818 9.818z"/></svg>

              </Button>
            </div>
          ))}
        </div>
      </Modal>
    </div>
  );
};

// TRANSPARENCY (Public data per law)
// ============================================================
const Transparency = ({ data }) => {
  const totalIncome = data.finances.income.reduce((s, i) => s + Number(i.amount), 0);
  const totalExpenses = data.finances.expenses.reduce((s, i) => s + Number(i.amount), 0);

  const expenseByCategory = data.finances.expenses.reduce((acc, e) => {
    acc[e.category] = (acc[e.category] || 0) + Number(e.amount);
    return acc;
  }, {});

  return (
    <div className="space-y-4">
      <div>
        <h2 className="font-black text-gray-900 text-xl">שקיפות לדיירים</h2>
        <p className="text-xs text-gray-400 mt-1">נתונים על פי חוק</p>
      </div>

      <div className="p-4 bg-emerald-50 rounded-2xl border border-emerald-100">
        <p className="text-sm font-semibold text-emerald-800 mb-3">📊 סיכום כספי שנתי</p>
        <div className="grid grid-cols-2 gap-3">
          <div>
            <p className="text-xl font-black text-emerald-700">₪{totalIncome.toLocaleString()}</p>
            <p className="text-xs text-emerald-600">סה״כ הכנסות</p>
          </div>
          <div>
            <p className="text-xl font-black text-red-500">₪{totalExpenses.toLocaleString()}</p>
            <p className="text-xs text-gray-500">סה״כ הוצאות</p>
          </div>
        </div>
        <div className="mt-3 pt-3 border-t border-emerald-200">
          <p className="text-sm font-bold text-gray-800">יתרה: <span className={totalIncome - totalExpenses >= 0 ? "text-emerald-700" : "text-red-600"}>₪{(totalIncome - totalExpenses).toLocaleString()}</span></p>
        </div>
      </div>

      {Object.keys(expenseByCategory).length > 0 && (
        <Card>
          <h3 className="font-bold text-gray-900 mb-3 text-sm">פירוט הוצאות לפי קטגוריה</h3>
          <div className="space-y-2">
            {Object.entries(expenseByCategory).sort(([, a], [, b]) => b - a).map(([cat, amount]) => (
              <div key={cat} className="flex items-center gap-3">
                <div className="text-sm text-gray-600 w-24 flex-shrink-0">{cat}</div>
                <div className="flex-1 bg-gray-100 rounded-full h-2 overflow-hidden">
                  <div className="bg-indigo-500 h-full rounded-full" style={{ width: `${Math.round((amount / totalExpenses) * 100)}%` }} />
                </div>
                <div className="text-sm font-semibold text-gray-800 w-20 text-right">₪{amount.toLocaleString()}</div>
              </div>
            ))}
          </div>
        </Card>
      )}

      <Card>
        <h3 className="font-bold text-gray-900 mb-3 text-sm">פרוטוקולים אחרונים</h3>
        {data.protocols.length === 0 ? (
          <p className="text-xs text-gray-400">אין פרוטוקולים עדיין</p>
        ) : (
          <div className="space-y-2">
            {data.protocols.slice(-3).map((p) => (

const CsvImporter = ({ data, setData }) => {
  const [status, setStatus] = React.useState(null);
  const fileRef = React.useRef();

  const parseAndImport = (text, fileName) => {
    const isExcel = fileName.endsWith('.xls') || fileName.endsWith('.xlsx');
    const lines = text.split(/\r?\n/).filter(l => l.trim());
    
    const income = [];
    const expenses = [];
    let imported = 0;

    // Detect separator
    const sep = lines[0] && lines[0].includes('\t') ? '\t' : ',';

    lines.forEach((line, idx) => {
      if (idx === 0) return; // skip header
      const cols = line.split(sep).map(c => c.replace(/^"|"$/g, '').trim());
      if (cols.length < 3) return;

      // Try to find date, description, amount columns
      // Common bank CSV formats: date, description, debit, credit, balance
      let dateStr = '', desc = '', debit = 0, credit = 0;

      // Discount bank format: תאריך, יום ערך, תיאור, אסמכתה, חובה, זכות, יתרה
      if (cols.length >= 6) {
        dateStr = cols[0];
        desc = cols[2] || cols[1];
        const debitStr = cols[4] ? cols[4].replace(/,/g, '') : '0';
        const creditStr = cols[5] ? cols[5].replace(/,/g, '') : '0';
        debit = parseFloat(debitStr) || 0;
        credit = parseFloat(creditStr) || 0;
      } else if (cols.length >= 3) {
        dateStr = cols[0];
        desc = cols[1];
        const amtStr = (cols[2] || '0').replace(/,/g, '');
        const amt = parseFloat(amtStr) || 0;
        if (amt > 0) credit = amt;
        else debit = Math.abs(amt);
      }

      if (!desc || (!debit && !credit)) return;

      // Convert date
      let isoDate = new Date().toISOString().split('T')[0];
      const dateParts = dateStr.split(/[\/\-\.]/);
      if (dateParts.length === 3) {
        const d = dateParts[0].padStart(2,'0');
        const m = dateParts[1].padStart(2,'0');
        const y = dateParts[2].length === 2 ? '20'+dateParts[2] : dateParts[2];
        isoDate = y+'-'+m+'-'+d;
      }

      // Auto-categorize
      const categorize = (d) => {
        const dl = d.toLowerCase();
        if (dl.includes('מעלית') || dl.includes('ברלינר')) return 'מעליות';
        if (dl.includes('חשמל')) return 'חשמל';
        if (dl.includes('ניקיון') || dl.includes('פירון')) return 'ניקיון';
        if (dl.includes('גינון') || dl.includes('סמל')) return 'גינון';
        if (dl.includes('ביטוח') || dl.includes('מנורה')) return 'ביטוח';
        if (dl.includes('פרטנר') || dl.includes('תקשורת')) return 'תקשורת';
        if (dl.includes('עמלת') || dl.includes('בנק')) return 'עמלות בנק';
        if (dl.includes('ועד')) return 'דמי ועד';
        if (dl.includes('שיק')) return 'שיקים / ספקים';
        return 'אחר';
      };

      const entry = {
        id: Date.now() + Math.random(),
        description: desc,
        date: isoDate,
        category: categorize(desc),
        uploadedBy: 'ייבוא CSV'
      };

      if (credit > 0) {
        income.push({...entry, amount: credit});
        imported++;
      }
      if (debit > 0) {
        expenses.push({...entry, amount: debit});
        imported++;
      }
    });

    if (imported === 0) {
      setStatus({type: 'error', msg: 'לא נמצאו נתונים. ודא שהקובץ בפורמט CSV תקין.'});
      return;
    }

    const merged = {
      ...data,
      finances: {
        income: [...(data.finances?.income || []), ...income],
        expenses: [...(data.finances?.expenses || []), ...expenses]
      }
    };
    setData(merged);
    fsSet(merged).then(() => {
      setStatus({type: 'success', msg: '✅ יובאו ' + imported + ' תנועות (' + income.length + ' הכנסות, ' + expenses.length + ' הוצאות)'});
    });
  };

  const handleFile = (file) => {
    if (!file) return;
    setStatus({type: 'loading', msg: 'מעבד...'});
    const reader = new FileReader();
    reader.onload = (e) => parseAndImport(e.target.result, file.name);
    reader.readAsText(file, 'windows-1255');
  };

  return (
    <div className="space-y-3">
      <input ref={fileRef} type="file" accept=".csv,.txt,.xls,.xlsx" className="hidden"
        onChange={e => e.target.files[0] && handleFile(e.target.files[0])} />
      <button onClick={() => fileRef.current && fileRef.current.click()}
        className="w-full flex items-center justify-center gap-2 py-2.5 bg-white border-2 border-dashed border-gray-300 rounded-xl text-sm text-gray-600 hover:border-indigo-400 hover:text-indigo-600 transition-all">
        📂 בחר קובץ CSV / Excel מהבנק
      </button>
      {status && (
        <div className={"p-3 rounded-xl text-sm " + (status.type === 'success' ? 'bg-emerald-50 text-emerald-700' : status.type === 'error' ? 'bg-red-50 text-red-600' : 'bg-blue-50 text-blue-600')}>
          {status.msg}
        </div>
      )}
      <div className="text-xs text-gray-400 space-y-1">
        <p>📋 פורמט נתמך: CSV של בנק דיסקונט, הפועלים, לאומי</p>
        <p>📥 להורדה: דפי חשבון ← ייצוא ← CSV</p>
      </div>
    </div>
  );
};

function VaadBayitApp() {
  const getSavedUser = () => {
    try { return JSON.parse(localStorage.getItem("vaad_bayit_user")) || null; } catch { return null; }
  };
  const [user, setUser] = React.useState(getSavedUser);
  const [activeTab, setActiveTab] = React.useState("home");
  const [data, setDataState] = React.useState(getStorage());
  const [syncing, setSyncing] = React.useState(true);

  const setData = (newData) => {
    setDataState(newData);
    setStorage(newData);
  };

  // Load from Firestore on startup + poll every 10 seconds
  React.useEffect(() => {
    const syncFromCloud = async () => {
      try {
        const remote = await fsGet();
        if (remote && remote.residents) {
          const local = getStorage();
          // Merge: keep whichever has more residents
          const merged = remote.residents.length >= (local.residents || []).length ? remote : local;
          localStorage.setItem(STORAGE_KEY, JSON.stringify(merged));
          setDataState(merged);
        }
      } catch(e) {
        console.log("sync error:", e);
      } finally {
        setSyncing(false);
      }
    };

    // Load immediately
    syncFromCloud();

    // Poll every 15 seconds for updates
    const interval = setInterval(syncFromCloud, 15000);
    return () => clearInterval(interval);
  }, []);

  // Check if user is committee member
  const isCommittee = user?.role === "committee" || user?.role === "admin";
  const pendingCount = data.residents.filter((r) => r.status === "pending").length;

  const COMMITTEE_EMAILS = ["vaadbayit2006@gmail.com", "moshekatz881@gmail.com"];

  const handleLogin = async (u) => {
    const isCommitteeEmail = COMMITTEE_EMAILS.includes(u.email);
    
    // תמיד טען נתונים עדכניים מהענן קודם
    let currentData = data;
    try {
      const remote = await fsGet();
      if (remote && remote.residents) {
        currentData = remote;
        setDataState(remote);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(remote));
      }
    } catch(e) {}

    const existing = currentData.residents.find((r) => r.email === u.email);
    
    if (existing) {
      const role = isCommitteeEmail ? "committee" : existing.role;
      const status = isCommitteeEmail ? "active" : existing.status;
      if (isCommitteeEmail && (existing.role !== "committee" || existing.status !== "active")) {
        const newData = { ...currentData, residents: currentData.residents.map(r => r.email === u.email ? {...r, role: "committee", status: "active"} : r) };
        setData(newData);
      }
      const savedU1 = { ...u, role, status };
      localStorage.setItem("vaad_bayit_user", JSON.stringify(savedU1));
      setUser(savedU1);
    } else {
      // דייר חדש — שמור מיד ב-Firebase
      const role = isCommitteeEmail ? "committee" : "resident";
      const status = isCommitteeEmail ? "active" : "pending";
      const phone = isCommitteeEmail ? "" : (prompt("ברוך הבא! אנא הזן מספר טלפון (חובה לאישור):") || "");
      const apartment = isCommitteeEmail ? "" : (prompt("מספר דירה:") || "");
      const newResident = { ...u, id: Date.now(), role, status, apartment, phone, joinDate: new Date().toISOString().split("T")[0] };
      const newData = { ...currentData, residents: [...currentData.residents, newResident] };
      
      // שמור מיידית בענן
      setStorage(newData);
      setDataState(newData);
      
      const savedU = { ...u, role, status };
      localStorage.setItem("vaad_bayit_user", JSON.stringify(savedU));
      setUser(savedU);
    }
  };

  const handleLogout = () => { localStorage.removeItem('vaad_bayit_user'); setUser(null); };

  if (!user) return <LoginScreen onLogin={handleLogin} />;
  if (user.status === "pending") return <PendingScreen user={user} onLogout={handleLogout} />;

  const renderTab = () => {
    switch (activeTab) {
      case "home": return <Dashboard data={data} user={user} isCommittee={isCommittee} setActiveTab={setActiveTab} />;
      case "finances": return <Finances data={data} setData={setData} isCommittee={isCommittee} />;
      case "faults": return <Faults data={data} setData={setData} user={user} isCommittee={isCommittee} />;
      case "residents": return <Residents data={data} setData={setData} user={user} isCommittee={isCommittee} />;
      case "inspections": return <Inspections data={data} setData={setData} isCommittee={isCommittee} />;
      case "protocols": return <Protocols data={data} setData={setData} isCommittee={isCommittee} />;
      case "transparency": return <Transparency data={data} />;
      case "more": return <MoreMenu setTab={setActiveTab} isCommittee={isCommittee} onLogout={handleLogout} user={user} />;
      default: return null;
    }
  };

  const mainTabs = ["home", "finances", "faults", "residents", "more"];

  return (
    <div className="min-h-screen bg-gray-50" dir="rtl">
      {/* Header */}
      <header className="sticky top-0 z-30 bg-white/90 backdrop-blur border-b border-gray-100">
        <div className="max-w-lg mx-auto px-4 py-3 flex items-center justify-between">
          <div className="flex items-center gap-2">
            {!mainTabs.includes(activeTab) && (
              <button onClick={() => setActiveTab("more")} className="p-1.5 hover:bg-gray-100 rounded-xl mr-1">
                <Icon name="chevron" size={18} className="rotate-90" />
              </button>
            )}
            <span className="text-xl">🏢</span>
            <span className="font-black text-gray-900" style={{ fontFamily: "serif" }}>ועד הבית</span>
            {isCommittee && <Badge text="ועד" color="purple" />}
          </div>
          <div className="flex items-center gap-2">
            {syncing ? (
              <div className="w-2 h-2 bg-amber-400 rounded-full animate-pulse" title="מסנכרן..." />
            ) : (
              <div className="w-2 h-2 bg-emerald-400 rounded-full" title="מסונכרן לענן ✓" />
            )}
          </div>
        </div>
      </header>

      {/* Main content */}
      <main className="max-w-lg mx-auto px-4 pt-5 pb-24">
        {renderTab()}
      </main>

      {/* Bottom Nav */}
      <BottomNav
        active={mainTabs.includes(activeTab) ? activeTab : "more"}
        setActive={setActiveTab}
        isCommittee={isCommittee}
        pendingCount={pendingCount}
      />
    </div>
  );
}

  </script>
